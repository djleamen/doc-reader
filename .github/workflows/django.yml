name: Django CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Unit tests
      # src/utils.py is dependency-free, so these run fast and fail loudly.
      run: pytest tests -q
    - name: Django tests
      env:
        # settings.py refuses to start without this; it is a throwaway value
        # for the test run only and is never used outside CI.
        DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      run: python manage.py test
